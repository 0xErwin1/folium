name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run obsolete; the emulator job is the
# expensive part of this pipeline, so cancelling early is worth it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; only the release job widens this to `contents: write`.
permissions:
  contents: read

env:
  # ktlint runs as a standalone CLI binary rather than a Gradle plugin: the project uses strict
  # dependency verification (gradle/verification-metadata.xml plus per-module lockfiles), and a
  # plugin would have to be added to that verified graph. Version and digest are pinned together.
  KTLINT_VERSION: "1.8.0"
  KTLINT_SHA256: "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75"

jobs:
  check:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Non-blocking on purpose: the existing codebase does not follow ktlint's wrapping and
      # trailing-comma conventions, so a blocking gate would fail on day one for reasons unrelated
      # to any given change. Flip `continue-on-error` off once a formatting pass has landed.
      - name: Check formatting (ktlint, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/ktlint" \
            "https://github.com/ktlint/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  ${RUNNER_TEMP}/ktlint" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/ktlint"
          "${RUNNER_TEMP}/ktlint" --relative "**/src/**/*.kt" "**/*.kts"

      # No `--offline` anywhere in CI: the runner starts with an empty cache and must actually
      # download and checksum-verify every dependency against gradle/verification-metadata.xml.
      - name: Run unit tests and architecture guards
        run: >-
          ./gradlew --console=plain
          :reader-core:testDebugUnitTest
          :app:testDebugUnitTest
          verifyArchitecture
          verifyArchitectureNegative

      # Android Lint already fails the build on errors by default (abortOnError), so no extra
      # configuration or baseline is needed; the codebase currently reports warnings only.
      - name: Run Android Lint
        run: ./gradlew --console=plain :app:lint

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Instrumented tests and beta release
    needs: check
    # Pull requests get the `check` gate only; a beta release is published for main and for
    # manual dispatches.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # `secrets` is not a valid context inside a step-level `if`, so the presence of the signing
      # material is resolved once here into a plain string. No secret value is exposed by this.
      RELEASE_SIGNING_AVAILABLE: >-
        ${{ secrets.KEYSTORE_BASE64 != ''
        && secrets.KEYSTORE_PASSWORD != ''
        && secrets.KEY_ALIAS != ''
        && secrets.KEY_PASSWORD != '' }}
    steps:
      # `fetch-depth: 0` is required by the version computation: the default shallow clone carries
      # no tags and a truncated commit list, so the last release tag would never be found and every
      # run would resolve the same version.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Exports FOLIUM_VERSION_NAME/FOLIUM_VERSION_CODE for the Gradle build and the bump reason
      # for the release notes. The version is injected, never committed back, so the pipeline
      # cannot trigger itself with a version bump push.
      - name: Compute the release version
        run: ./.github/scripts/compute-version.sh

      # Without this the emulator falls back to software rendering and the job times out.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 matches compileSdk/targetSdk. x86_64 is required because the packaged MuPDF and
      # Tesseract native libraries are the only ABIs the emulator can load.
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew --console=plain
            :app:connectedDebugAndroidTest
            :engine-mupdf:connectedDebugAndroidTest
            :ocr-tesseract:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14

      # The keystore only ever exists as a runner-temp file decoded from a secret; nothing is
      # written to the workspace and no credential value is ever echoed.
      - name: Stage release signing material
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/signing"
          keystore="${RUNNER_TEMP}/signing/release.jks"

          # Pasting the secret through a browser field readily introduces newlines or stray
          # spaces, which base64 rejects outright; stripping whitespace keeps a good key from
          # failing over its transport.
          if ! printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${keystore}"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Regenerate it with 'base64 -w0 <your>.jks' and paste the whole single line."
            exit 1
          fi

          # A Java keystore starts with 0xFEEDFEED (JKS) or 0x30 (PKCS12). Checking here turns a
          # truncated or wrong-file secret into a named failure instead of a signing error later.
          magic=$(head -c 4 "${keystore}" | od -An -tx1 | tr -d ' \n')
          case "${magic}" in
            feedfeed*|30*) ;;
            *)
              echo "::error::The decoded KEYSTORE_BASE64 is not a Java keystore (got $(stat -c%s "${keystore}") bytes). Re-encode the .jks file itself."
              exit 1
              ;;
          esac

          chmod 600 "${keystore}"
          echo "RELEASE_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"

      # Gradle reports every signing problem as "keystore password was incorrect", which is wrong
      # for three of the four ways this can fail. Reproducing the checks with keytool first turns
      # each into a named cause, and does it before the two-minute build rather than after it.
      - name: Verify the signing material matches the secrets
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          keystore="${RELEASE_KEYSTORE_PATH}"

          # A value pasted into a browser field keeps whatever newline came with it, and an alias
          # or password with a trailing newline is not the alias or password the keystore holds.
          store_pass=$(printf '%s' "${KEYSTORE_PASSWORD}" | tr -d '\r\n')
          key_alias=$(printf '%s' "${KEY_ALIAS}" | tr -d '\r\n')
          key_pass=$(printf '%s' "${KEY_PASSWORD}" | tr -d '\r\n')

          if [ "${store_pass}" != "${KEYSTORE_PASSWORD}" ] || [ "${key_alias}" != "${KEY_ALIAS}" ] || [ "${key_pass}" != "${KEY_PASSWORD}" ]; then
            echo "::warning::A signing secret carried a trailing newline; it was trimmed for this build. Re-paste it without the line break."
          fi

          # A digest of the keystore reveals nothing about the key, but it tells you whether the
          # secret carries the file you think it does — which separates "wrong keystore uploaded"
          # from "wrong password" without another round of guessing.
          echo "Decoded keystore SHA-256: $(sha256sum "${keystore}" | cut -d' ' -f1)"
          echo "Compare it with: sha256sum <your>.jks"

          if ! keytool -list -keystore "${keystore}" -storepass "${store_pass}" > /tmp/keytool-store.log 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore. If the digest above matches your local file, the password secret is stale; if it does not, KEYSTORE_BASE64 holds a different keystore."
            exit 1
          fi

          # The alias is itself a secret, so it is never echoed — only whether it was found.
          if ! grep -qiE "^${key_alias}," /tmp/keytool-store.log; then
            echo "::error::KEY_ALIAS is not present in the keystore. Run 'keytool -list -keystore <your>.jks' locally and copy the alias exactly."
            exit 1
          fi

          # PKCS12 keystores cannot hold a key password that differs from the store password; a
          # mismatch here is the most common cause of the misleading Gradle error.
          if ! keytool -exportcert -keystore "${keystore}" -storepass "${store_pass}" -alias "${key_alias}" > /dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the key. For a PKCS12 keystore it must equal KEYSTORE_PASSWORD."
            exit 1
          fi

          echo "Signing material verified: alias present, store and key passwords accepted."

      # When the secrets are absent these variables are empty and app/build.gradle.kts falls back
      # to the debug key, so a fork or an unconfigured repository still produces a working APK.
      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Prepare the release asset
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_name=$(jq -er '.elements[0].versionName' "${metadata}")
          version_code=$(jq -er '.elements[0].versionCode' "${metadata}")

          # Reading the version back out of the built APK's metadata proves the injection actually
          # reached Gradle; a mismatch means the release would be tagged with a version the artifact
          # does not carry.
          if [ "${version_name}" != "${FOLIUM_VERSION_NAME}" ] || [ "${version_code}" != "${FOLIUM_VERSION_CODE}" ]; then
            echo "::error::The built APK reports ${version_name} (${version_code}) but the computed version is ${FOLIUM_VERSION_NAME} (${FOLIUM_VERSION_CODE})."
            exit 1
          fi

          tag="v${version_name}-beta.${GITHUB_RUN_NUMBER}"

          if [ "${RELEASE_SIGNING_AVAILABLE}" = "true" ]; then
            asset_name="folium-${tag}.apk"
            signing_note="Signed with the project release keystore."
          else
            asset_name="folium-${tag}-debug-signed.apk"
            signing_note="**Debug-signed — testing only.** No release keystore is configured, so this APK is signed with the Android debug key. It cannot be upgraded in place from a properly signed build and must not be distributed."
          fi

          install -d "${RUNNER_TEMP}/release"
          cp app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/release/${asset_name}"

          {
            echo "RELEASE_TAG=${tag}"
            echo "RELEASE_ASSET=${RUNNER_TEMP}/release/${asset_name}"
          } >> "${GITHUB_ENV}"
          {
            echo "RELEASE_BODY<<EOF"
            echo "Automated beta build of \`${GITHUB_SHA}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${version_name}\` (versionCode \`${version_code}\`) |"
            echo "| Bump | ${FOLIUM_BUMP_REASON} |"
            echo "| Commit range | \`${FOLIUM_COMMIT_RANGE}\` |"
            echo
            echo "${signing_note}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Publish the beta prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Folium ${{ env.RELEASE_TAG }}
          prerelease: true
          # GitHub appends the auto-generated changelog (the commit range since the previous
          # release) underneath this body.
          generate_release_notes: true
          body: ${{ env.RELEASE_BODY }}
          files: ${{ env.RELEASE_ASSET }}
          fail_on_unmatched_files: true
