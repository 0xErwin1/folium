appId: com.folium.reader
name: Library — add a book, read it, keep progress across a cold start
tags:
  - library
  - rf2
---
# Selectors below are taken from the real view hierarchy on emulator-5554 via
# `maestro hierarchy`. The picker is Google DocumentsUI; the app-managed
# library has no folder-grant premise, so this flow covers add -> open ->
# progress -> cold start instead.

- launchApp:
    clearState: true

# Empty library: no folder grant prompt anywhere.
- assertVisible: "Your library is empty"
- assertVisible: "Add book"
- assertNotVisible: "Choose a folder to read from"
- assertNotVisible: "Choose folder"

- tapOn: "Add book"

# The debug FixtureDocumentsProvider root is offered by the system picker
# alongside device storage; select it, then the one fixture document whose
# icon and mime type mark it as a real, renderable PDF ("original.pdf",
# rendered off-screen below the fold on a phone-sized grid until scrolled).
- assertVisible: "Folium SAF Fixture"
- tapOn: "Folium SAF Fixture"
- assertVisible: "opaque-resource"
- scroll
- tapOn: "original.pdf"

# Back in the app: the imported book row appears with its title and page 1.
# The title is the fixture provider's own DISPLAY_NAME ("original.pdf"), not
# the raw document id — the picker's single-document metadata query now
# resolves through FixtureDocumentsProvider.queryDocument the same way it
# does through queryChildDocuments.
- extendedWaitUntil:
    visible: "original.pdf"
    timeout: 15000
- assertVisible: "Library"
- assertVisible: "1 added"
- assertVisible: "Page 1 of 3 · 33%"

- tapOn: "Dismiss"

# Open the book and advance a couple of pages.
- tapOn: "original.pdf"
- assertVisible: "1 / 3"
- tapOn: "Next page"
- tapOn: "Next page"
- assertVisible: "3 / 3"

# Leaving the reader flushes the pending write and reloads the shelf, so the
# row reflects the advanced page immediately — no cold start needed.
- tapOn: "Back to library"
- assertVisible: "Page 3 of 3 · 100%"

# Cold start, no clearState: the book is still listed with its advanced
# progress and no re-prompt of any kind — a grant-free relaunch.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "original.pdf"
    timeout: 15000
- assertVisible: "Library"
- assertVisible: "Page 3 of 3 · 100%"
- assertNotVisible: "Choose a folder to read from"

# It resumes at the stored page.
- tapOn: "original.pdf"
- assertVisible: "3 / 3"
