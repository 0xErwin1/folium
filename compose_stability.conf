// Types the Compose compiler must treat as stable.
//
// The library model lives in :reader-core, which deliberately does not apply the Compose compiler
// plugin, so its types cannot be annotated @Immutable without giving the neutral core a Compose
// dependency. Every type in that package is an immutable data class, data object or sealed
// hierarchy over such types, so declaring them here states a fact the code already holds.
//
// The read-only collection interfaces are declared stable for the same reason: nothing in this app
// publishes a List or Map it keeps mutating afterwards.
com.folium.reader.core.library.**
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
